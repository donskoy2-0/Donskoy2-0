<!doctype html>
<html lang="en" data-boundary="PRE_AUTHORITY_PRESENTATION_ONLY">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0b0d0f">
    <meta name="robots" content="noindex, nofollow">
    <!-- PUBLICATION_SEO_METADATA -->
    <title>Donskoy 2.0</title>
    <link rel="stylesheet" href="/assets/styles.css">
    <script type="module" src="/assets/app.mjs"></script>
  </head>
  <body>
    <div
      class="outer-cover"
      id="outer-cover"
      role="button"
      aria-label="Continue to entry"
      tabindex="0"
    >
      <img id="outer-cover-art" src="/media/outer/cover-00.webp" alt="">
    </div>

    <div class="shell" id="shell" data-state="loading">
      <header class="shell__header">
        <a class="brand" href="/" aria-label="Protocol Donskoy 2.0 home">
          <span class="brand__name">PROTOCOL DONSKOY 2.0</span>
        </a>
        <nav class="language" id="language-selector" aria-label="Language"></nav>
      </header>

      <main class="shell__main">
        <section class="protocol" id="entry-protocol" aria-labelledby="entry-heading" hidden>
          <div class="protocol__eyebrow">
            <span class="protocol__signal" aria-hidden="true"></span>
            <span id="entry-subtitle">interactive novel</span>
          </div>

          <h1 id="entry-heading">PROTOCOL READY TO START</h1>
          <div class="protocol__copy" id="entry-copy"></div>

          <div class="entry-control" aria-live="polite">
            <div class="entry-human" id="entry-human" aria-label="Cloudflare HUMAN verification" hidden>
              <div class="entry-human__label">HUMAN / CLOUDFLARE VERIFICATION</div>
              <div id="entry-turnstile"></div>
            </div>
            <div class="entry-control__status">
              <span class="entry-control__status-dot" aria-hidden="true"></span>
              <span id="entry-status">ENTRY UNAVAILABLE</span>
            </div>
            <button id="entry-accept" class="entry-control__button" type="button" disabled>START</button>
          </div>
        </section>
      </main>

      <footer class="shell__footer">
        <span>PRE-AUTHORITY</span>
        <a class="shell__license" href="/license/" target="_blank" rel="noopener noreferrer" aria-label="Read license summaries">[ LICENSE ]</a>
        <span>138024</span>
      </footer>
    </div>
    <noscript>This reader shell requires JavaScript.</noscript>
  </body>
</html>
